[phases.setup]
nixPkgs = ["...", "python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate",
  "python manage.py crear_superusuario"
]

[start]
cmd = "gunicorn CoworkSpaceKC.wsgi --log-file -"
