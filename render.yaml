services:
  - type: web
    name: coworkspace-kc
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn CoworkSpaceKC.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: coworkspace-db
          property: connectionString

databases:
  - name: coworkspace-db
    databaseName: coworkspace_kc
    user: coworkspace_user
